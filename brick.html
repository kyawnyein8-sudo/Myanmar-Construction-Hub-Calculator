<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>အုတ်စီရန် Calculator</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; font-family: 'Padauk', sans-serif; }
    body { background: #f0f2f5; padding: 16px; margin: 0; }
    .header { background: #2481cc; color: white; padding: 12px; border-radius: 8px; display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    .card { background: white; padding: 16px; border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); margin-bottom: 12px; }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-weight: bold; margin-bottom: 4px; font-size: 0.9rem; }
    input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ccc; font-size: 0.95rem; }
    .btn { width: 100%; padding: 12px; background: #2481cc; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; }
    .result-box { background: #eef6fc; border: 1px solid #2481cc; border-radius: 8px; padding: 12px; margin-top: 12px; display: none; }
    .result-item { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 0.9rem; }
  </style>
</head>
<body>

  <div class="header">
    <a href="index.html" style="color: white; text-decoration: none;"><i class="fa-solid fa-arrow-left"></i></a>
    <h3 style="margin: 0;">🧱 အုတ်စီရန် တွက်ချက်စက်</h3>
  </div>

  <div class="card">
    <div class="form-group">
      <label>အုတ်နံရံ အလျား (ပေ):</label>
      <input type="number" id="wallLength" placeholder="ဥပမာ - 10" />
    </div>
    <div class="form-group">
      <label>အုတ်နံရံ အမြင့် (ပေ):</label>
      <input type="number" id="wallHeight" placeholder="ဥပမာ - 10" />
    </div>
    <div class="form-group">
      <label>နံရံအထူ:</label>
      <select id="wallType" style="width:100%; padding:10px; border-radius:6px; border:1px solid #ccc;">
        <option value="half">၄ လက်မခွဲ နံရံ (အုတ်တစ်လွှာ)</option>
        <option value="full">၉ လက်မ နံရံ (အုတ်နှစ်လွှာ)</option>
      </select>
    </div>
    <button class="btn" onclick="calculateBrick()">တွက်ချက်မည်</button>

    <div class="result-box" id="resultBox">
      <div class="result-item"><span>လိုအပ်သော အုတ်ရေ:</span><strong id="resBricks">0 လုံး</strong></div>
      <div class="result-item"><span>ဘိလပ်မြေ (၁:၄) :</span><strong id="resCement">0 အိတ်</strong></div>
      <div class="result-item"><span>သဲ:</span><strong id="resSand">0 ကျင်း/Cu.ft</strong></div>
    </div>
  </div>

  <script>
    function calculateBrick() {
      const len = parseFloat(document.getElementById('wallLength').value) || 0;
      const height = parseFloat(document.getElementById('wallHeight').value) || 0;
      const type = document.getElementById('wallType').value;

      if (len <= 0 || height <= 0) {
        alert('ကျေးဇူးပြု၍ တန်ဖိုးများကို မှန်ကန်စွာ ဖြည့်စွက်ပါ');
        return;
      }

      const sqft = len * height;
      let bricks = 0;
      let cement = 0;
      let sand = 0;

      if (type === 'half') {
        // 4.5 inch wall standard estimation per sqft
        bricks = Math.ceil(sqft * 4.5);
        cement = (sqft * 0.02).toFixed(2);
        sand = (sqft * 0.08).toFixed(2);
      } else {
        // 9 inch wall standard estimation per sqft
        bricks = Math.ceil(sqft * 9);
        cement = (sqft * 0.04).toFixed(2);
        sand = (sqft * 0.16).toFixed(2);
      }

      document.getElementById('resBricks').innerText = bricks + ' လုံး';
      document.getElementById('resCement').innerText = cement + ' အိတ်';
      document.getElementById('resSand').innerText = sand + ' Cu.ft';
      document.getElementById('resultBox').style.display = 'block';

      // Save to History
      saveToHistory('အုတ်စီရန် တွက်ချက်မှု', `${bricks} လုံး / ${cement} အိတ်`);
    }

    function saveToHistory(title, result) {
      const history = JSON.parse(localStorage.getItem('myanmar_hub_history') || '[]');
      const date = new Date().toLocaleDateString('my-MM');
      history.unshift({ title, result, date });
      localStorage.setItem('myanmar_hub_history', JSON.stringify(history.slice(0, 10)));
    }
  </script>
</body>
</html>
