<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Myanmar Construction Hub</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#2481cc" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary-color: #2481cc;
      --text-muted: #6c757d;
    }
    * {
      box-sizing: border-box;
      font-family: 'Padauk', sans-serif;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      min-height: 100vh;
      background: #f0f2f5;
    }
    body {
      padding: 16px;
      display: flex;
      flex-direction: column;
    }
    .main-wrapper {
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      flex: 1;
      padding-bottom: 65px;
    }
    .header {
      background: var(--primary-color);
      color: white;
      padding: 20px 16px;
      border-radius: 14px;
      text-align: center;
      margin-bottom: 12px;
      box-shadow: 0 4px 12px rgba(36,129,204,0.25);
    }
    .header h2 {
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1.4;
    }
    .header p {
      font-size: 0.88rem;
      opacity: 0.9;
      margin-top: 4px;
    }
    .ticker-bar {
      background: #ffffff;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      color: #333;
      margin-bottom: 16px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      border-left: 4px solid var(--primary-color);
    }
    .install-banner {
      display: none;
      justify-content: space-between;
      align-items: center;
      background: #eef6fc;
      border: 1px solid var(--primary-color);
      padding: 10px 14px;
      border-radius: 10px;
      margin-bottom: 16px;
    }
    .install-btn {
      background: var(--primary-color);
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      width: 100%;
    }
    .app-card {
      background: white;
      border-radius: 14px;
      padding: 20px 12px;
      text-align: center;
      text-decoration: none;
      color: #2c3e50;
      box-shadow: 0 3px 8px rgba(0,0,0,0.06);
      border: 1px solid rgba(0,0,0,0.04);
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 120px;
    }
    .app-card:active {
      transform: scale(0.96);
      background: #f8fafc;
    }
    .app-icon {
      font-size: 2rem;
      margin-bottom: 8px;
    }
    .app-name {
      font-weight: 700;
      font-size: 0.95rem;
      line-height: 1.3;
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }
    .shop-card {
      background: white;
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
    .shop-card.is-vip {
      border: 1px solid #ffc107;
      background: #fffdf5;
    }
    .vip-tag {
      font-size: 0.65rem;
      background: #ffc107;
      color: #000;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
      display: inline-block;
      margin-bottom: 4px;
    }
    .call-action-btn {
      background: #28a745;
      color: white;
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
    }
    .history-item {
      background: white;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .footer-note {
      text-align: center;
      margin-top: auto;
      padding-top: 24px;
      padding-bottom: 8px;
      font-size: 0.8rem;
      color: #888;
    }
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      display: flex;
      justify-content: space-around;
      padding: 8px 0;
      border-top: 1px solid #ddd;
      max-width: 600px;
      margin: 0 auto;
    }
    .nav-item {
      border: none;
      background: none;
      color: #666;
      font-size: 0.75rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
    }
    .nav-item.active {
      color: var(--primary-color);
      font-weight: bold;
    }
    .nav-item i {
      font-size: 1.2rem;
      margin-bottom: 2px;
    }
  </style>
</head>
<body>

  <div class="main-wrapper">
    <div class="header">
      <h2>🏗️ Myanmar Construction Hub</h2>
      <p>ဆောက်လုပ်ရေး တွက်ချက်မှုဆိုင်ရာ ကူညီပေးမည့် Tool များ</p>
    </div>

    <div id="installBanner" class="install-banner">
      <span style="font-size: 0.85rem;">App အဖြစ် ဖုန်းထဲထည့်သွင်းပါ</span>
      <button class="install-btn" onclick="installPWA()">Install</button>
    </div>

    <div id="tickerContent" class="ticker-bar">
      📢 ယနေ့ ပေါက်ဈေးများ စောင့်ကြည့်စစ်ဆေးနေပါသည်...
    </div>

    <div id="tabApps" class="tab-content active">
      <div id="appsContainer" class="grid"></div>
    </div>

    <div id="tabShops" class="tab-content">
      <h3 style="margin-bottom: 12px; font-size: 1rem;">ဆိုင်များနှင့် အဆက်အသွယ်များ</h3>
      <div id="shopsContainer"></div>
    </div>

    <div id="tabHistory" class="tab-content">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <h3 style="font-size: 1rem;">တွက်ချက်မှု မှတ်တမ်းများ</h3>
        <button onclick="clearHistory()" style="background:none; border:none; color:#dc3545; cursor:pointer; font-size: 0.85rem;">
          <i class="fa-solid fa-trash"></i> ရှင်းလင်းမည်
        </button>
      </div>
      <div id="historyListContainer"></div>
    </div>

    <div class="footer-note">
      KN Metal Welding & Fabrication
    </div>
  </div>

  <div class="bottom-nav">
    <button class="nav-item active" onclick="switchTab('tabApps', this)">
      <i class="fa-solid fa-border-all"></i>
      <span>Apps</span>
    </button>
    <button class="nav-item" onclick="switchTab('tabShops', this)">
      <i class="fa-solid fa-store"></i>
      <span>ဆိုင်များ</span>
    </button>
    <button class="nav-item" onclick="switchTab('tabHistory', this)">
      <i class="fa-solid fa-clock-rotate-left"></i>
      <span>မှတ်တမ်း</span>
    </button>
  </div>

  <script src="app.js"></script>
</body>
</html>
