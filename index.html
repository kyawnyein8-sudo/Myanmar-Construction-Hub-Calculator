<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>မြန်မာ့ဆောက်လုပ်ရေး Hub</title>
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#2481cc" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; font-family: 'Padauk', sans-serif; }
    body { background: #f0f2f5; margin: 0; padding: 0; color: #333; padding-bottom: 70px; }
    
    .header { background: #2481cc; color: white; padding: 16px; text-align: center; border-bottom-left-radius: 16px; border-bottom-right-radius: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .header h2 { margin: 0; font-size: 1.3rem; }
    
    .container { max-width: 500px; margin: 0 auto; padding: 16px; }
    
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; }
    .card { background: white; padding: 20px 12px; border-radius: 12px; text-align: center; text-decoration: none; color: #333; box-shadow: 0 2px 6px rgba(0,0,0,0.06); display: flex; flex-direction: column; align-items: center; justify-content: center; transition: 0.2s; }
    .card:active { transform: scale(0.96); background: #eef6fc; }
    .card i { font-size: 2rem; color: #2481cc; margin-bottom: 8px; }
    .card span { font-size: 0.95rem; font-weight: bold; }
    
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    
    .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; background: white; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #ddd; max-width: 500px; margin: 0 auto; }
    .nav-item { border: none; background: none; color: #777; font-size: 0.8rem; display: flex; flex-direction: column; align-items: center; cursor: pointer; }
    .nav-item.active { color: #2481cc; font-weight: bold; }
    .nav-item i { font-size: 1.2rem; margin-bottom: 2px; }

    .history-item { background: white; padding: 12px; border-radius: 8px; margin-bottom: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; }
    .history-title { font-weight: bold; color: #2481cc; }
    .history-date { font-size: 0.75rem; color: #888; }
    
    .price-input { margin-bottom: 10px; }
    .price-input label { font-size: 0.85rem; font-weight: bold; display: block; margin-bottom: 4px; }
    .price-input input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; }
    .btn-save { width: 100%; background: #2481cc; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; margin-top: 10px; }
  </style>
</head>
<body>

  <div class="header">
    <h2>🏗️ မြန်မာ့ဆောက်လုပ်ရေး Hub</h2>
  </div>

  <div class="container">
    <!-- Home Tab -->
    <div id="tab-home" class="tab-content active">
      <div class="grid">
        <a href="./brick.html" class="card">
          <i class="fa-solid fa-cubes"></i>
          <span>အုတ်စီ / အချောကိုင်</span>
        </a>
        <div class="card" onclick="alert('မကြာမီ လာမည်...')">
          <i class="fa-solid fa-fill-drip"></i>
          <span>ကွန်ကရစ် တွက်စက်</span>
        </div>
      </div>
    </div>

    <!-- History Tab -->
    <div id="tab-history" class="tab-content">
      <h3>📜 တွက်ချက်မှု မှတ်တမ်းများ</h3>
      <div id="history-list"></div>
    </div>

    <!-- Settings Tab -->
    <div id="tab-settings" class="tab-content">
      <h3>⚙️ Standard ဈေးနှုန်းများ ပြင်ရန်</h3>
      <div class="price-input">
        <label>ဘိလပ်မြေ ၁ အိတ် (ကျပ်)</label>
        <input type="number" id="set-cement" value="15000">
      </div>
      <div class="price-input">
        <label>အုတ် ၁ လုံး (ကျပ်)</label>
        <input type="number" id="set-brick" value="250">
      </div>
      <button class="btn-save" onclick="savePrices()">သိမ်းဆည်းမည်</button>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <div class="nav-bar">
    <button class="nav-item active" onclick="switchTab('home', this)">
      <i class="fa-solid fa-house"></i>
      <span>ပင်မ</span>
    </button>
    <button class="nav-item" onclick="switchTab('history', this)">
      <i class="fa-solid fa-clock-rotate-left"></i>
      <span>မှတ်တမ်း</span>
    </button>
    <button class="nav-item" onclick="switchTab('settings', this)">
      <i class="fa-solid fa-gear"></i>
      <span>ပြင်ဆင်ရန်</span>
    </button>
  </div>

  <script src="./app.js"></script>
  <script>
    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      
      document.getElementById('tab-' + tabId).classList.add('active');
      btn.classList.add('active');

      if (tabId === 'history') loadHistory();
    }

    function loadHistory() {
      const list = document.getElementById('history-list');
      const data = JSON.parse(localStorage.getItem('myanmar_hub_history') || '[]');
      if (data.length === 0) {
        list.innerHTML = '<p style="color:#888; text-align:center;">မှတ်တမ်း မရှိသေးပါ။</p>';
        return;
      }
      list.innerHTML = data.map(item => `
        <div class="history-item">
          <div>
            <div class="history-title">${item.title}</div>
            <div class="history-date">${item.date}</div>
          </div>
          <div style="font-weight:bold; color:#d9534f;">${item.result}</div>
        </div>
      `).join('');
    }

    function savePrices() {
      const cement = document.getElementById('set-cement').value;
      const brick = document.getElementById('set-brick').value;
      localStorage.setItem('myanmar_hub_prices', JSON.stringify({ cement, brick }));
      alert('ဈေးနှုန်းများ သိမ်းဆည်းပြီးပါပြီ!');
    }

    // Register PWA Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW Fail:', err));
    }
  </script>
</body>
</html>
