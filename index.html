<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Myanmar Construction Hub</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#2481cc" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; font-family: 'Padauk', sans-serif; }
    body { background: #f0f2f5; padding: 16px; margin: 0; }
    .header { background: #2481cc; color: white; padding: 16px; border-radius: 12px; text-align: center; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(36,129,204,0.2); }
    .header h2 { margin: 0; font-size: 1.4rem; }
    .header p { margin: 4px 0 0 0; font-size: 0.85rem; opacity: 0.9; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .menu-card { background: white; border-radius: 12px; padding: 16px; text-align: center; text-decoration: none; color: #333; box-shadow: 0 2px 6px rgba(0,0,0,0.05); transition: transform 0.2s; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
    .menu-card:active { transform: scale(0.96); }
    .menu-card i { font-size: 2rem; color: #2481cc; }
    .menu-card span { font-weight: bold; font-size: 0.95rem; }
  </style>
</head>
<body>

  <div class="header">
    <h2>🏗️ Myanmar Construction Hub</h2>
    <p>ဆောက်လုပ်ရေး တွက်ချက်မှုဆိုင်ရာ ကူညီပေးမည့် Tool များ</p>
  </div>

  <div class="grid">
    <a href="brick.html" class="menu-card">
      <i class="fa-solid fa-cubes"></i>
      <span>🧱 အုတ်စီ / အချောကိုင်</span>
    </a>

    <a href="concrete.html" class="menu-card">
      <i class="fa-solid fa-fill-drip"></i>
      <span>🏗️ ကွန်ကရစ် တွက်စက်</span>
    </a>

    <a href="#" class="menu-card" onclick="alert('မကြာမီ လာမည်...')">
      <i class="fa-solid fa-house-chimney"></i>
      <span>🏠 ခေါင်းမိုး တွက်စက်</span>
    </a>

    <a href="#" class="menu-card" onclick="alert('မကြာမီ လာမည်...')">
      <i class="fa-solid fa-paint-roller"></i>
      <span>🖌️ ဆေးသုတ်ခြင်း</span>
    </a>
  </div>

  <script src="app.js"></script>
</body>
</html>
