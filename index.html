<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Myanmar Construction Hub</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#2481cc" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Padauk', sans-serif;
      margin: 0;
      padding: 0;
    }
    
    html, body {
      width: 100%;
      min-height: 100vh;
      background: #f0f2f5;
    }

    body {
      padding: 16px;
      display: flex;
      flex-direction: column;
    }

    .main-wrapper {
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .header {
      background: #2481cc;
      color: white;
      padding: 20px 16px;
      border-radius: 14px;
      text-align: center;
      margin-bottom: 20px;
      box-shadow: 0 4px 12px rgba(36,129,204,0.25);
    }

    .header h2 {
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1.4;
    }

    .header p {
      font-size: 0.88rem;
      opacity: 0.9;
      margin-top: 4px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      width: 100%;
    }

    .menu-card {
      background: white;
      border-radius: 14px;
      padding: 24px 12px;
      text-align: center;
      text-decoration: none;
      color: #2c3e50;
      box-shadow: 0 3px 8px rgba(0,0,0,0.06);
      border: 1px solid rgba(0,0,0,0.04);
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 130px;
    }

    .menu-card:active {
      transform: scale(0.96);
      background: #f8fafc;
    }

    .icon-box {
      width: 56px;
      height: 56px;
      background: #eef6fc;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
    }

    .menu-card i {
      font-size: 1.6rem;
      color: #2481cc;
    }

    .menu-card span {
      font-weight: 700;
      font-size: 0.95rem;
      line-height: 1.3;
    }

    .footer-note {
      text-align: center;
      margin-top: auto;
      padding-top: 24px;
      padding-bottom: 8px;
      font-size: 0.8rem;
      color: #888;
    }
  </style>
</head>
<body>

  <div class="main-wrapper">
    <!-- Header -->
    <div class="header">
      <h2>🏗️ Myanmar Construction Hub</h2>
      <p>ဆောက်လုပ်ရေး တွက်ချက်မှုဆိုင်ရာ ကူညီပေးမည့် Tool များ</p>
    </div>

    <!-- Main Grid Menu -->
    <div class="grid">
      <a href="brick.html" class="menu-card">
        <div class="icon-box">
          <i class="fa-solid fa-cubes"></i>
        </div>
        <span>အုတ်စီ / အချောကိုင်</span>
      </a>

      <a href="concrete.html" class="menu-card">
        <div class="icon-box">
          <i class="fa-solid fa-fill-drip"></i>
        </div>
        <span>ကွန်ကရစ် တွက်စက်</span>
      </a>

      <a href="#" class="menu-card" onclick="alert('မကြာမီ လာမည်...')">
        <div class="icon-box">
          <i class="fa-solid fa-house-chimney"></i>
        </div>
        <span>ခေါင်းမိုး တွက်စက်</span>
      </a>

      <a href="#" class="menu-card" onclick="alert('မကြာမီ လာမည်...')">
        <div class="icon-box">
          <i class="fa-solid fa-paint-roller"></i>
        </div>
        <span>ဆေးသုတ်ခြင်း</span>
      </a>
    </div>

    <div class="footer-note">
      KN Metal Welding & Fabrication
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
